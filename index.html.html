<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="在 1MDB抢钱大作战中收金币、跳过障碍，抵达1MDB金库。">
<title>1MDB抢钱大作战</title>
<style>
:root{color-scheme:light;--ink:#233d35;--muted:#4c655a;--paper:#fff9e7;--line:#c4d5ac}
*{box-sizing:border-box}body{margin:0;background:#ecf3de;color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:1110px;margin:auto;padding:clamp(12px,3vw,34px)}
header{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:16px}h1{font-size:clamp(1.55rem,4vw,2.6rem);line-height:1.15;margin:4px 0 0;letter-spacing:-.055em}.eyebrow{font-size:.66rem;letter-spacing:.22em;font-weight:850;color:#526b58}.tag,.chip{background:#fffaf0;border:1px solid var(--line);border-radius:24px;padding:7px 11px;font-size:.8rem;font-weight:800;white-space:nowrap}
.frame{border:2px solid #29483c;border-radius:22px;overflow:hidden;box-shadow:0 7px 0 #cedcba;background:var(--paper)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#fff9e8}.meters,.actions{display:flex;align-items:center;gap:6px}.chip{padding:5px 9px}.coinmark{color:#9c5800}.hearts{color:#af3a59;letter-spacing:.08em}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;font-weight:800;border:1px solid #abc29e;background:#f6f9eb;border-radius:12px;padding:7px 10px}button:hover{background:#e5f2d6}button:focus-visible{outline:3px solid #296b7d;outline-offset:2px}
.scene{position:relative;height:clamp(340px,52vw,510px);max-height:65svh;min-height:300px;background:#9fdbdf;overflow:hidden}canvas{display:block;width:100%;height:100%}
.screen{position:absolute;inset:0;display:grid;place-items:center;padding:12px;background:#1d4a4936}.screen[hidden], [hidden]{display:none!important}.panel{text-align:center;background:#fff9e8;border:2px solid #29483c;border-radius:21px;padding:clamp(10px,2.5vw,24px);width:min(100%,440px);box-shadow:0 6px 0 #27483980}.panel h2{margin:4px 0;font-size:clamp(1.25rem,3.5vw,2rem);line-height:1.1}.panel p{margin:8px 0 14px;color:var(--muted);font-size:.86rem}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{display:flex;flex-direction:column;align-items:center;gap:5px;background:#ddebff;border-color:#9fb9de;padding:7px}.choice.pink{background:#ffe1e7;border-color:#e6aebb}.choice:hover{filter:brightness(.96)}.choice img{display:block;width:clamp(45px,8vw,76px);height:clamp(49px,8vw,80px);object-fit:fill;border-radius:45% 45% 40% 40%;background:#f4e9cb}.start-label{font-size:.64rem;font-weight:700;opacity:.8}.primary,.jump{background:#ffcf6d;border-color:#bb863b}.primary:hover,.jump:hover{background:#ffdc91}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;touch-action:none;user-select:none}.control{min-width:54px;min-height:44px;font-size:1.08rem;touch-action:none;box-shadow:0 2px 0 #a5b88c}.control.held{transform:translateY(2px);box-shadow:none;background:#d7e9c9}.jump{min-width:82px}.hint{font-size:.76rem;text-align:center;color:var(--muted);line-height:1.35}.note{margin:15px 0 0;text-align:center;font-size:.78rem;color:var(--muted)}
@media(max-width:460px){.toolbar{padding:7px}.toolbar button{font-size:.72rem;padding:6px}.chip{font-size:.73rem}.hint{max-width:7rem}.controls{padding:8px}.control{min-width:48px}.scene{height:53svh}}
@media(max-height:510px) and (orientation:landscape){main{padding:6px 12px}header{margin-bottom:6px}h1{font-size:1.1rem}.scene{height:62svh;min-height:180px}.panel{padding:8px}.panel p{margin:4px 0 8px}.choice img{width:48px;height:49px}.note{display:none}.control{min-height:32px}.controls,.toolbar{padding:4px 9px}}
#menu{place-items:end start;background:transparent;padding:16px}
#menu .panel{width:min(100%,330px);padding:12px;background:#fff9e8f2;text-align:left}
#menu .choice{flex-direction:row;justify-content:center;flex-wrap:wrap;font-size:.77rem;gap:4px;padding:6px}
#menu .choice img{width:33px;height:37px}
#menu .start-label{display:none}
#menu .panel p{margin:4px 0 8px}
@media(max-width:660px){#menu{place-items:end center;padding:8px}#menu .panel{padding:8px}#menu .eyebrow{display:none}#menu .panel p{font-size:.73rem}}
.choice img,#menu .choice img{object-fit:contain;border-radius:0;background:transparent}
.volume{display:flex;align-items:center;gap:4px;font-size:.72rem;white-space:nowrap}.volume input{width:clamp(44px,11vw,120px);accent-color:#467a67}.volume output{min-width:3ch;text-align:right}@media(max-width:480px){.volume output{display:none}.volume input{width:48px}}
.weapons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:0 9px 8px}
.weapon{font-size:.74rem;min-height:42px;padding:4px 2px;line-height:1.2}
.weapon kbd{display:block;font-size:.7rem}
.weapon:disabled{opacity:.55;cursor:default}
@media(max-width:480px){.weapons{gap:3px;padding-inline:6px}.weapon{font-size:.66rem}}
@media(max-width:480px){.controls .hint{display:none}}

#avatar-open{margin-top:7px;padding:5px 10px;font-size:.76rem}
#avatar-panel{width:min(100%,440px);margin:12px auto 18px;border:2px solid #29483c;border-radius:20px;background:#fff9e8;color:#29483c;padding:16px}
#avatar-panel h2{margin:0 0 9px;font-size:1.4rem}
.avatar-top,.avatar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.avatar-top select{font:inherit;max-width:100%;padding:6px;border:1px solid #abc29e;border-radius:8px;background:#fffdf4;color:inherit}
#avatar-file{display:block;font:inherit;font-size:.88rem;width:100%;min-height:48px;margin-top:10px;cursor:pointer}
#avatar-file::file-selector-button{min-height:44px;margin-right:8px;padding:8px 12px;border:1px solid #bb863b;border-radius:10px;background:#ffcf6d;color:#29483c;font:inherit;font-weight:800;cursor:pointer}
@media(pointer:coarse){#avatar-open,.avatar-actions button{min-height:44px}}
.avatar-alternatives{margin:0 0 12px;padding:10px;border:1px solid #d5d9b9;border-radius:12px;background:#f5f7e8}
.avatar-alternatives p{margin:0;font-size:.82rem;line-height:1.4}
.avatar-alternatives a{display:inline-flex;align-items:center;min-height:44px;padding:7px 10px;border-radius:12px;background:#ffcf6d;color:inherit;font-size:.8rem;font-weight:800;text-decoration:none}
#avatar-link{width:100%;margin-top:8px;padding:8px;font:inherit;font-size:.8rem}
@media(max-width:660px){#avatar-panel{margin-bottom:76px}}
#avatar-preview{width:96px;height:112px;flex:none;display:block;background:#e3ecd9;border-radius:14px;touch-action:none;cursor:grab}
.avatar-editor{display:flex;align-items:center;gap:14px;margin:12px 0}
.avatar-sliders{display:grid;gap:7px;flex:1;min-width:0}
.avatar-sliders label{display:grid;grid-template-columns:2.6em minmax(0,1fr);align-items:center;font-size:.8rem}
.avatar-sliders input{width:100%;margin:0;accent-color:#467a67}
#avatar-status{margin:8px 0 0;font-size:.82rem;line-height:1.4}
.avatar-actions button{font-size:.8rem}
.avatar-actions button:disabled{opacity:.5;cursor:default}
@media(max-height:420px){#avatar-open{margin-top:4px;padding-block:3px}}
.title-mark{display:inline-block;height:1.32em;width:auto;vertical-align:-.23em;margin:0 .06em;border-radius:.13em}
</style>

function makeBrickRows(){

 const weatherPrizes=surfaceRoom?[]:['rain','thunder'];
 for(const [x,y,w] of platforms){
   for(let start=x;start<x+w;start+=24){
     const span=Math.min(24,x+w-start);
     const island=ground.find(([left,right])=>start>=left+48&&start+span<=right-55);
     if(span<10||!island)continue;
     const top=Math.min(y,(island[2]??floor)-149);
     if([bonusBlock,...rewardBricks].some(block=>start<block.x+block.w&&start+span>block.x&&top+brickHeight>block.y))continue;
     const index=tiles.length;
     const weatherReady=weatherPrizes[0]==='rain'?index>=1:index>=14&&index%11!==4;
     const weather=span>=18&&weatherReady?weatherPrizes.shift():null;
     const question=weather??(span>=18?questionPrizes[index%14]:null);
     const prize=question??(index%11===4?'mushroom':index%11===8?weaponTypes[(index+stageIndex)%weaponTypes.length]:null);
     tiles.push({x:start,y:top,w:span,h:brickHeight,prize,question:!!question,left:island[0],broken:false,used:false,bump:0});
   }
 }
 return tiles;
}

function seaAttack(e){

}
function defeat(e,x,y,type){

function bombAim(enemy){
 if(enemy.type){
   const {x,y}=seaAttack(enemy);
   const center=Math.min(seaLine-4,y+(enemy.type==='snake'?0:9));
   return {x,y:center,base:center+12,type:enemy.type};
 }
 const base=(enemy.roadTop??floor)-enemy.lift;
 const offset=enemy.kind==='slime'?12:enemy.kind==='beetle'||enemy.kind==='crab'?15:28;
 return {x:enemy.x,y:base-offset,base,type:enemy.kind};
}
function nearestBombTarget(x,y){
 let target=null, best=Infinity;
 for(const enemy of [...enemies,...waterEnemies]){
   if(!enemy.alive)continue;
   const aim=bombAim(enemy), distance=(aim.x-x)**2+(aim.y-y)**2;
   if(distance<best){target=enemy;best=distance;}
 }
 return target;
}
function refundInFlightBombs(){

}
function advanceStarBomb(shot,dt){
 if(rainLeft>0)return;
 if(!shot.target?.alive)shot.target=nearestBombTarget(shot.x,shot.y);
 if(!shot.target){
   shot.done=true;
   ammo.bomb=(ammo.bomb??0)+1;updateGear();
   return;
 }
 const aim=bombAim(shot.target);
 const dx=aim.x-shot.x,dy=aim.y-shot.y;
 const distance=Math.hypot(dx,dy),step=rewards.bomb.speed*dt;
 if(distance<=step){
   resolveWeaponHit(shot,{...aim,e:shot.target,impactX:aim.x,impactY:aim.y});
   shot.done=true;return;
 }
 shot.x+=dx*step/distance;
 shot.y+=dy*step/distance;
}
function projectileContact(fromX,fromY,toX,toY,target){
 const x=(fromX-target.x)/target.rx, y=(fromY-target.y)/target.ry;
 const dx=(toX-fromX)/target.rx, dy=(toY-fromY)/target.ry;
 const c=x*x+y*y-1;
 if(c<=0)return 0;
 const a=dx*dx+dy*dy;
 const b=x*dx+y*dy;
 const d=b*b-a*c;
 if(a===0||d<0)return Infinity;
 const entry=(-b-Math.sqrt(d))/a;
 return entry>=0&&entry<=1?entry:Infinity;
}
function findWeaponHit(fromX,fromY,shot){
 if(rainLeft>0)return null;
 let hit=null, earliest=Infinity;
 function check(e,x,y,rx,ry,base,type){
   const entry=projectileContact(fromX,fromY,shot.x,shot.y,{x,y,rx,ry});
   if(entry<earliest){
     earliest=entry;
     hit={e,x,y,base,type,impactX:fromX+(shot.x-fromX)*entry,impactY:fromY+(shot.y-fromY)*entry};
   }
 }
 for(const e of enemies){
   if(!e.alive)continue;
   const base=(e.roadTop??floor)-e.lift;
   if(e.kind==='slime')check(e,e.x,base-12,21,14,base,e.kind);
   else if(e.kind==='beetle'||e.kind==='crab')check(e,e.x,base-15,20,15,base,e.kind);
   else{
     check(e,e.x,base-28,22,14,base,e.kind);
     check(e,e.x,base-17,12,13,base,e.kind);
   }
 }
 for(const e of waterEnemies){
   if(!e.alive)continue;
   const {x,y,arc}=seaAttack(e);
   if(arc<.25)continue;
   if(e.type==='snake'){
     check(e,x,y,16,10,y+12,e.type);
     for(let i=1;i<=5&&y+i*11<seaLine+3;i++){
       check(e,x+Math.sin(i*.9+time*4)*10,y+i*11,10,9,y+12,e.type);
     }
   }else check(e,x,y+9,24,12,y+19,e.type);
 }
 return hit;
}

function advanceExtras(dt,oldY,head,half){
 for(const brick of rewardBricks){
   brick.bump=Math.max(0,brick.bump-dt);

   if(player.vy<0&&oldY-head>=bottom-.01&&player.y-head<=bottom&&Math.abs(player.x-brick.x-brick.w/2)<brick.w/2+half){
     bumpHero(bottom,head);
     if(brick.used)continue;
     brick.used=true;brick.bump=.24;
     looseRewards.push({type:brick.type,x:brick.x+22,y:brick.y+5,age:0,vy:-174,top:brick.y,minX:ground.find(([left,right])=>brick.x>=left&&brick.x<right)?.[0]});
     sound([[523,0],[784,.08]]);
   }
 }
 for(const item of looseRewards){
   item.age+=dt;
   if(item.age<.25){item.y=item.top+5-34*item.age/.25;continue;}
   if(item.y<roadHeightAt(item.x)-15){item.x=Math.max(item.minX??0,item.x-89*dt);item.vy+=650*dt;item.y=Math.min(roadHeightAt(item.x)-15,item.y+item.vy*dt);}
   if(Math.abs(item.x-player.x)<23+half&&item.y>player.y-head-9&&item.y<player.y+10){
     item.taken=true;collectReward(item.type);burst(item.x,item.y,rewards[item.type]?.color??'#ffdc65',10);
   }
 }
 looseRewards=looseRewards.filter(item=>!item.taken);
 for(const shot of shots){
   if(shot.type==='bomb'){advanceStarBomb(shot,dt);continue;}
   const fromX=shot.x, fromY=shot.y;
   shot.age+=dt;
   const weapon=rewards[shot.type];
   shot.x+=shot.dir*dt*(weapon.speed+(shot.type==='missile'?shot.age*230:0));
   if(shot.type==='arrow')shot.y+=dt*(-48+155*shot.age);
   const tip=shot.type==='arrow'?15:shot.type==='missile'?16:0;
   const angle=shot.type==='arrow'?Math.atan2(-48+155*shot.age,weapon.speed):0;
   const tipX=shot.dir*tip*Math.cos(angle), tipY=tip*Math.sin(angle);
   const hit=findWeaponHit(fromX+tipX,fromY+tipY,{x:shot.x+tipX,y:shot.y+tipY});
   if(hit){resolveWeaponHit(shot,hit);shot.done=true;}
   if(shot.y>=seaLine||ground.some(([left,right,top=floor])=>shot.y>=top&&shot.x>=left&&shot.x<=right))shot.done=true;
 }
 shots=shots.filter(shot=>!shot.done&&(shot.type==='bomb'||shot.age<1.05));
 for(const effect of effects)effect.age+=dt;
 effects=effects.filter(effect=>effect.age<(effect.thunder?1.55:effect.weapon?1.48:.66));
}

function sound(notes){
 if(muted||!audio||audio.state!=='running')return;
 const now=audio.currentTime;
 notes.forEach(([freq,delay])=>{const osc=audio.createOscillator(), gain=audio.createGain();osc.type='triangle';osc.frequency.value=freq;gain.gain.setValueAtTime(.045,now+delay);gain.gain.exponentialRampToValueAtTime(.001,now+delay+.18);osc.connect(gain).connect(masterGain);osc.start(now+delay);osc.stop(now+delay+.19);});
}
let brickCrack, thunderRumble;
function makeNoise(seconds,sample){
 const buffer=audio.createBuffer(1,Math.round(audio.sampleRate*seconds),audio.sampleRate);
 const samples=buffer.getChannelData(0);
 for(let i=0;i<samples.length;i++)samples[i]=sample(i/audio.sampleRate,Math.random()*2-1);
 return buffer;
}
function playNoise(buffer,volume){
 const source=audio.createBufferSource(), gain=audio.createGain();
 source.buffer=buffer;gain.gain.value=volume;
 source.connect(gain).connect(masterGain);source.start();
}
function soundBrickBreak(){
 if(muted||!audio||audio.state!=='running'||volume===0)return;
 if(!brickCrack){
   let previous=0;
   brickCrack=makeNoise(.25,(t,noise)=>{
     const grit=noise*.70-previous*.18;
     previous=noise;
     const split=Math.exp(-95*t);
     const chips=(t>=.035?.58*Math.exp(-78*(t-.035)):0)+(t>=.082?.32*Math.exp(-38*(t-.082)):0);
     return grit*(split+chips)+.22*Math.sin(t*2*Math.PI*205)*Math.exp(-42*t);
   });
 }
 playNoise(brickCrack,.42);
}
function soundThunder(){
 if(muted||!audio||audio.state!=='running'||volume===0)return;
 if(!thunderRumble){
   let low=0;
   thunderRumble=makeNoise(1.15,(t,noise)=>{
     low+=.019*(noise-low);
     const crack=noise*.5*Math.exp(-55*t);
     const rumble=(low*2.2+Math.sin(2*Math.PI*(61*t-15*t*t))*.28)*Math.exp(-3.4*t);
     return crack+rumble;
   });
 }
 playNoise(thunderRumble,.42);
}

}

}

async function detectAvatarFace(photo){
 if(typeof window.FaceDetector!=='function')return null;
 try{
   const detector=new window.FaceDetector({maxDetectedFaces:5,fastMode:true});
   const faces=await Promise.race([detector.detect(photo),new Promise(resolve=>setTimeout(()=>resolve([]),650))]);
   return faces.map(face=>face.boundingBox)
     .filter(face=>face.width>0&&face.height>0)
     .sort((a,b)=>b.width*b.height-a.width*a.height)[0]??null;
 }catch{return null;}
}
async function loadAvatarPhoto(file){

 if(!file)return;
 if(file.size>20*1024*1024){
   avatarStatus.textContent='请选择小于 20 MB 的照片。';return;
 }
 avatarStatus.textContent='正在读取照片…';
 const url=URL.createObjectURL(file);
 try{
   const photo=new Image();
   await new Promise((resolve,reject)=>{
     photo.onload=resolve;photo.onerror=reject;photo.src=url;
   });
   if(request!==avatarLoad)return;
   const sample=document.createElement('canvas');
   const ratio=Math.min(1,1200/Math.max(photo.naturalWidth,photo.naturalHeight));
   sample.width=Math.max(1,Math.round(photo.naturalWidth*ratio));
   sample.height=Math.max(1,Math.round(photo.naturalHeight*ratio));
   sample.getContext('2d').drawImage(photo,0,0,sample.width,sample.height);
   avatarStatus.textContent='正在定位头像…';
   const face=await detectAvatarFace(sample);
   if(request!==avatarLoad)return;
   avatarPhoto=sample;
   const fit=Math.min(sample.height,sample.width/avatarRatio);
   avatarZoom.value=face?clamp(fit/Math.max(face.height*1.38,face.width*1.24/avatarRatio),.5,12):1;
   setAvatarCenter(face?(face.x+face.width/2)/sample.width:.5,
     face?(face.y+face.height*.39)/sample.height:sample.height>sample.width?.35:.5);
   renderAvatarCrop();
   byId('avatar-editor').hidden=false;avatarApply.disabled=false;
   avatarStatus.textContent=face?'已找到人脸。可拖动照片或用滑杆微调。':'拖动照片或用滑杆，把头发和下巴放进预览框。';
 }catch{
   if(request===avatarLoad)avatarStatus.textContent='这张照片无法打开。请试试 JPG、PNG 或 WebP。';

   avatarStatus.textContent='链接已复制。打开 Chrome，粘贴到地址栏，就会直接打开换脸页。';
 }catch{
   field.value=link;field.hidden=false;field.focus();field.select();
   avatarStatus.textContent='长按复制这个链接，再贴到 Chrome 地址栏打开。';
 }
});
byId('avatar-paste').addEventListener('click',async()=>{
 const request=avatarLoad;
 try{
   const items=await window.navigator.clipboard.read();
   for(const item of items){
     const type=item.types.find(type=>type.startsWith('image/'));
     if(!type)continue;
     const photo=await item.getType(type);
     if(request===avatarLoad)loadAvatarPhoto(photo);
     return;
   }
   if(request===avatarLoad)avatarStatus.textContent='剪贴板里没有照片。请先复制一张图片，或用 Chrome 从相册选图。';
 }catch{
   if(request===avatarLoad)avatarStatus.textContent='这里无法读取剪贴板照片。请用 Chrome 打开换脸页，从相册选图。';
 }
});
avatarPanel.addEventListener('paste',event=>{
 const photo=[...event.clipboardData.items].find(item=>item.kind==='file'&&item.type.startsWith('image/'))?.getAsFile();
 if(!photo)return;
 event.preventDefault();loadAvatarPhoto(photo);
});
avatarFile.addEventListener('change',()=>{
 const file=avatarFile.files[0];
 if(!file)return;
 avatarFile.value='';
 loadAvatarPhoto(file);
});
for(const control of [avatarZoom,avatarX,avatarY])control.addEventListener('input',renderAvatarCrop);
avatarPreview.addEventListener('pointerdown',event=>{
 if(!avatarPhoto||avatarDrag)return;
 avatarDrag={id:event.pointerId,x:event.clientX,y:event.clientY,cx:Number(avatarX.value),cy:Number(avatarY.value)};
 avatarPreview.setPointerCapture(event.pointerId);
});
avatarPreview.addEventListener('pointermove',event=>{
 if(!avatarDrag||event.pointerId!==avatarDrag.id)return;
 const bounds=avatarPreview.getBoundingClientRect();
 const cropHeight=avatarCropSize(avatarPhoto);
 setAvatarCenter(avatarDrag.cx/1000-(event.clientX-avatarDrag.x)/bounds.width*cropHeight*avatarRatio/avatarPhoto.width,
   avatarDrag.cy/1000-(event.clientY-avatarDrag.y)/bounds.height*cropHeight/avatarPhoto.height);
 renderAvatarCrop();
});
avatarPreview.addEventListener('lostpointercapture',()=>{avatarDrag=null;});
avatarApply.addEventListener('click',()=>{
 if(!avatarPhoto)return;
 const index=Number(avatarHero.value), src=avatarPreview.toDataURL('image/png');
 portraits[index].src=src;
 try{localStorage.setItem(avatarKey(index),src);}
 catch{showGuide('已换头像。浏览器空间不足，这次头像只在当前页面有效。');}
 closeAvatarPanel();
 byId('avatar-open').focus();
});
byId('avatar-reset').addEventListener('click',()=>{
 const index=Number(avatarHero.value);
 portraits[index].src=originalPortraits[index];
 try{localStorage.removeItem(avatarKey(index));}catch{}
 closeAvatarPanel();
 byId('avatar-open').focus();
});
byId('avatar-close').addEventListener('click',()=>{
 closeAvatarPanel();byId('avatar-open').focus();
});

document.querySelectorAll('[data-hero]').forEach(button=>button.addEventListener('click',()=>startCampaign(Number(button.dataset.hero))));
function continueCampaign(){
 if(phase==='won'){
   if(stageIndex===stages.length-1){startCampaign(hero);return;}
   const level=growthLevel();stageIndex++;startStage(level);return;
 }
 ammo={};shield=false;startStage();
}
byId('retry').addEventListener('click',continueCampaign);
byId('pipe').addEventListener('click',()=>{usePipe();byId('pipe').blur();});
for(const type of weaponTypes){
 const button=byId('weapon-'+type);
 button.addEventListener('click',event=>{
   useGear(type);
   if(event.detail>0)button.blur();
 });
}
function showCastleMenu(){
 phase='menu';stageIndex=0;clearInput();ammo={};shield=false;pipe=null;surfaceRoom=null;updateGear();updatePipeButton();
 byId('stage').textContent='✦ 城堡入口';byId('stage').title='城堡大门';
 showGuide('选好角色，从城堡大门出发。');
 byId('score').textContent='0';byId('total').textContent='–';
 byId('hearts').textContent='♥♥♥';byId('hearts').setAttribute('aria-label','3 颗爱心');
 byId('result').hidden=true;byId('menu').hidden=false;
}
byId('change').addEventListener('click',()=>{showCastleMenu();document.querySelector('.choice').focus();});
try{
 const saved=localStorage.getItem('meadow-volume');
 if(saved!==null&&Number.isFinite(Number(saved)))volume=clamp(Number(saved),0,100);
}catch{}
syncVolume();
byId('mute').addEventListener('click',()=>{
 muted=!muted;syncVolume();if(!muted)unlock();
});
byId('volume').addEventListener('input',event=>{
 volume=Number(event.target.value);muted=false;syncVolume();unlock();
 try{localStorage.setItem('meadow-volume',String(volume));}catch{}
});
byId('volume').addEventListener('change',()=>sound([[523,0],[660,.065]]));
showCastleMenu();resize();new ResizeObserver(resize).observe(canvas);
const avatarTarget=window.location&&new URLSearchParams(window.location.search).get('avatar');
if(avatarTarget==='boy'||avatarTarget==='girl'){
 openAvatarPanel();
 avatarHero.value=avatarTarget==='girl'?'1':'0';
 updateChromeLink();
}
let last=0;
function loop(now){
 const elapsed=Math.min(.04,(now-(last||now))/1000);last=now;time+=elapsed;
 if(phase==='intro'){
   const previous=introTime;introTime+=elapsed;
   if(previous<1.05&&introTime>=1.05)sound([[196,0],[247,.12],[330,.26]]);
   if(introTime>=introDuration)startStage();
 }else if(phase==='vault'){
   vaultTime+=elapsed;
   cam+=(clamp(finish-width*.5,0,Math.max(0,world-width))-cam)*Math.min(1,elapsed*6);
   if(vaultTime>=vaultDuration)end(true);
 }else if(phase==='play'){const n=Math.ceil(elapsed/.009)||1;for(let i=0;i<n&&phase==='play';i++)advance(elapsed/n);}
 draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
